name: Copy offline games to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-games:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Download the game repository on the GitHub runner
        uses: actions/checkout@v5

      - name: Check configuration and game files
        run: |
          test -n "${R2_ENDPOINT}" || { echo "::error::R2_ENDPOINT is missing"; exit 1; }
          test -n "${R2_BUCKET}" || { echo "::error::R2_BUCKET is missing"; exit 1; }
          test -d offline || { echo "::error::The offline game folder was not found"; exit 1; }
          GAME_COUNT=$(find offline -maxdepth 1 -type f \( -name '*.html' -o -name '*.htm' \) | wc -l)
          test "${GAME_COUNT}" -eq 300 || { echo "::error::Expected 300 games, found ${GAME_COUNT}"; exit 1; }

      - name: Upload all single-file games to R2
        run: |
          aws s3 cp offline "s3://${R2_BUCKET}/" \
            --recursive \
            --endpoint-url "${R2_ENDPOINT}" \
            --exclude "*" \
            --include "*.html" \
            --include "*.htm" \
            --cache-control "public,max-age=31536000,immutable" \
            --no-progress \
            --only-show-errors

      - name: Finished
        run: |
          echo "Uploaded 300 game files to ${R2_BUCKET}."
